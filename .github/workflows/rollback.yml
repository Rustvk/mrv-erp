name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Введите первые 7 символов хэша коммита рабочей версии'
        required: true
      environment:
        description: 'Где откатываем?'
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Rollback VPS to specific Commit
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_VERSION: ${{ github.event.inputs.commit_hash }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TARGET_VERSION, GH_TOKEN, GH_ACTOR
          script: |
            cd ~/mrv-erp

            # Логинимся в Docker
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Подменяем строчку APP_VERSION в файле .env
            sed -i "s/^SUPPLY_VERSION=.*/SUPPLY_VERSION=$TARGET_VERSION/" .env
            sed -i "s/^DISTRIBUTION_VERSION=.*/DISTRIBUTION_VERSION=$TARGET_VERSION/" .env
            sed -i "s/^FINANCE_VERSION=.*/FINANCE_VERSION=$TARGET_VERSION/" .env

            # Перезапускаем контейнеры. Docker скачает старый образ и мгновенно его поднимет
            docker compose pull
            docker compose up -d
