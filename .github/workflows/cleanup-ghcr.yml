name: Cleanup Old GHCR Images

on:
  schedule:
    # Запускать автоматически каждое воскресенье в 3:00 ночи
    - cron: '0 3 * * 0'

  # Оставляем возможность запустить очистку вручную по кнопке
  workflow_dispatch:

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest

    # ⚡ КРИТИЧНО: Разрешаем экшену удалять пакеты
    permissions:
      packages: write
      contents: read

    strategy:
      # Матрица позволяет запустить один и тот же шаг для всех ваших приложений по очереди
      matrix:
        # Укажите здесь названия ваших пакетов.
        # Если образ пушится как ghcr.io/rustvk/mrv-erp/supply, то название пакета — mrv-erp/supply
        package:
          - 'mrv-erp/distribution'
          - 'mrv-erp/finance'
          - 'mrv-erp/supply'

    steps:
      - name: 🧹 Clean up ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: 'container'
          # Сколько последних версий оставлять (5 — отличный запас для отката)
          min-versions-to-keep: 5
          # (Опционально) Если раскомментировать, будет удалять только "осиротевшие" сборки без тегов
          # delete-only-untagged-versions: 'true'
