name: PR Checks

on:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Lint, Typecheck and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно для Turborepo --filter

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint --filter="...[origin/master]"

      - name: Run Typecheck
        run: pnpm run typecheck --filter="...[origin/master]"

      - name: Run Tests
        run: pnpm run test --filter="...[origin/master]"
